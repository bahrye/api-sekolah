name = "api-sekolah-cron"
main = "cron-sync.js"
compatibility_date = "2024-01-01"

[vars]
WORKER_BASE = "https://api-sekolah-cron.syamsulbahri-agro27b.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "nama-database-anda"
database_id = "313936c9-fefa-4f1a-87e3-59a63fd605e5"

# SYNC_SECRET: npx wrangler secret put SYNC_SECRET -c wrangler.cron.toml
#
# Jadwal otomatis — Cloudflare Cron Triggers (UTC):
#   * * * * *       → /tick tiap menit (lanjutkan sync saat "running")
#   0 17 * * SUN    → /run mingguan = Senin 01:00 WITA (Minggu 17:00 UTC)
#
# Manual (opsional): GET WORKER_BASE/tick atau /run?offset=0 + header X-Sync-Secret

[triggers]
crons = ["* * * * *", "0 17 * * SUN"]
