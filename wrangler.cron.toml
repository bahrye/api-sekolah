name = "api-sekolah-cron"
main = "cron-sync.js"
compatibility_date = "2024-01-01"

[vars]
WORKER_BASE = "https://api-sekolah-cron.syamsulbahri-agro27b.workers.dev"

# DATABASE_URL: npx wrangler secret put DATABASE_URL -c wrangler.cron.toml
# SYNC_SECRET: npx wrangler secret put SYNC_SECRET -c wrangler.cron.toml
#
# Cron Trigger OTOMATIS dinonaktifkan — sinkron lewat GitHub Actions (sync-github.yml).
# Worker tetap dipakai untuk HTTP: /step, /resume, /run (manual + secret).
#
# Untuk mengaktifkan lagi Cloudflare Cron (tidak disarankan jika pakai GHA):
# [triggers]
# crons = ["* * * * *", "0 17 * * SUN"]
