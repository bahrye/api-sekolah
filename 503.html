<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Layanan sibuk — EduAPI Indonesia</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-lg mx-auto px-4 py-4 flex items-center gap-2.5">
            <img src="/favicon.svg" alt="" width="32" height="32" class="w-8 h-8 rounded-lg">
            <span class="font-bold text-slate-900">EduAPI Indonesia</span>
        </div>
    </header>
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
            <p class="text-5xl font-bold text-amber-500 mb-2">503</p>
            <h1 class="text-xl font-bold text-slate-900 mb-2">Layanan sedang sibuk</h1>
            <p class="text-sm text-slate-600 leading-relaxed mb-6">
                Permintaan membutuhkan waktu terlalu lama (misalnya sinkronisasi data besar).
                Coba lagi dalam beberapa detik, atau gunakan parameter <code
                    class="bg-slate-100 px-1 rounded">maxPages</code> yang lebih kecil pada <code
                    class="bg-slate-100 px-1 rounded">/api/sync</code>.
            </p>
            <a href="/"
                class="inline-block bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors">
                Kembali ke beranda
            </a>
        </div>
    </main>
</body>

</html>
