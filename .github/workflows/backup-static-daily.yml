name: Backup Static JSON Cadangan (Harian)

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 17:00 UTC (00:00 WIB tengah malam)
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      pilihan_provinsi:
        description: '(Opsional) Nama provinsi spesifik (misal: GORONTALO). Kosongkan untuk semua provinsi.'
        type: string
        default: ''

concurrency:
  group: backup-static-json
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export-static:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jalankan Ekspor Data Static JSON dari Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PILIHAN_PROVINSI: ${{ github.event.inputs.pilihan_provinsi || '' }}
        run: |
          if [ -n "$PILIHAN_PROVINSI" ]; then
            node scripts/export-static-provinsi.cjs --prov="$PILIHAN_PROVINSI"
          else
            node scripts/export-static-provinsi.cjs
          fi

      - name: Simpan Perubahan ke Repositori
        id: commit_push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_provinsi/
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data statis."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(backup): perbarui data cadangan statis harian"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Hasil Backup ke Cloudflare Pages
        if: steps.commit_push.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=api-sekolah-kita --branch production --commit-dirty=true
