name: Sinkronisasi Data Sekolah Otomatis (15 Menit)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pilihan_provinsi:
        description: '(Opsional) Nama provinsi spesifik (misal: DKI JAKARTA). Kosongkan untuk jadwal cerdas otomatis.'
        type: string
        default: ''
      mulai_dari_awal:
        description: 'Mulai dari awal (reset offset ke 0)'
        type: boolean
        default: false

concurrency:
  group: "sekolah-sync-15m"
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  sync-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jalankan Skrip Sinkronisasi
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL || 'https://api-sekolah-kita.pages.dev' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.SYNC_SECRET }}
          PILIHAN_BENTUK: "Semua"
          PILIHAN_PROVINSI: ${{ github.event.inputs.pilihan_provinsi || '' }}
          MULAI_DARI_AWAL: ${{ github.event.inputs.mulai_dari_awal || 'false' }}
          IS_CRON_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: node scripts/fetch-custom.cjs
