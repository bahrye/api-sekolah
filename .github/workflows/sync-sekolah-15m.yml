name: Sinkronisasi Data Sekolah Otomatis (15 Menit)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pilihan_provinsi:
        description: '(Opsional) Nama provinsi spesifik (misal: DKI JAKARTA). Kosongkan untuk jadwal cerdas otomatis.'
        type: string
        default: ''
      mulai_dari_awal:
        description: 'Mulai dari awal (reset offset ke 0)'
        type: boolean
        default: false

concurrency:
  group: "sekolah-sync-15m"
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  sync-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Periksa & Batalkan Antrean Menumpuk
        id: check_queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/clean-github-runs.cjs check-running

      - name: Install dependencies
        if: steps.check_queue.outputs.skip_sync != 'true'
        run: npm ci

      - name: Jalankan Skrip Sinkronisasi
        if: steps.check_queue.outputs.skip_sync != 'true'
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL || 'https://api-sekolah-kita.pages.dev' }}
          DATA_SOURCE_URL: ${{ secrets.DATA_SOURCE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.SYNC_SECRET }}
          PILIHAN_BENTUK: "Semua"
          PILIHAN_PROVINSI: ${{ github.event.inputs.pilihan_provinsi || '' }}
          MULAI_DARI_AWAL: ${{ github.event.inputs.mulai_dari_awal || 'false' }}
          IS_CRON_SCHEDULE: ${{ github.event_name == 'schedule' || github.event.inputs.pilihan_provinsi == '' }}
          MAX_EXECUTION_MINUTES: "50"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/fetch-custom.cjs

      - name: Bersihkan Riwayat Workflow Runs (Pertahankan 4 Terakhir)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KEEP_RUNS_COUNT: "4"
        run: node scripts/clean-github-runs.cjs cleanup-history
