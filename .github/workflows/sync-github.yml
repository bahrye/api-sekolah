# Sinkron stabil ~240 baris/menit: 12× /step (20 sekolah) per menit, jeda 5 detik.
# Setup: GitHub → Settings → Secrets → Actions → SYNC_SECRET (sama dengan Worker)
# Opsional: Settings → Variables → WORKER_BASE (default URL Worker cron di bawah)

name: Sync sekolah (GitHub Actions)

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
    inputs:
      mulai_ulang:
        description: 'Mulai dari offset 0 + driver=github'
        type: boolean
        default: false

concurrency:
  group: sync-sekolah-gha
  cancel-in-progress: false

env:
  WORKER_BASE: ${{ vars.WORKER_BASE || 'https://api-sekolah-cron.syamsulbahri-agro27b.workers.dev' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Mulai sync (workflow manual)
        if: github.event_name == 'workflow_dispatch' && inputs.mulai_ulang == 'true'
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl -fsS -H "X-Sync-Secret: ${SYNC_SECRET}" \
            "${WORKER_BASE}/run?offset=0&resume=1&driver=github"

      - name: Pastikan sync aktif (offset terakhir)
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_SECRET:-}" ]; then
            echo "SYNC_SECRET belum di-set di GitHub Actions secrets."
            exit 1
          fi
          curl -fsS -H "X-Sync-Secret: ${SYNC_SECRET}" \
            "${WORKER_BASE}/resume?driver=github"
          echo ""

      - name: 12 langkah × 20 baris (≈240/menit)
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/step-body.json -w "%{http_code}" \
              -H "X-Sync-Secret: ${SYNC_SECRET}" \
              -H "Accept: application/json" \
              "${WORKER_BASE}/step")
            body=$(cat /tmp/step-body.json)
            echo "step ${i}/12 (HTTP ${code}): ${body}"
            case "${body}" in
              *'"status":"completed"'*) echo "Selesai."; exit 0 ;;
              *'"status":"paused"'*) echo "Sync dijeda — cek dashboard Worker."; exit 0 ;;
            esac
            if [ "${code}" -ge 400 ]; then
              echo "Step gagal HTTP ${code}"
              exit 1
            fi
            if [ "${i}" -lt 12 ]; then
              sleep 5
            fi
          done
          echo "12 step selesai (~240 baris)."
