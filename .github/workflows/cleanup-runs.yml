name: Bersihkan Riwayat Workflow Runs

on:
  schedule:
    - cron: '0 17 * * *' # Pukul 00:00 WIB (17:00 UTC) setiap hari
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Jumlah riwayat workflow run selesai yang ingin dipertahankan (default: 2)'
        required: true
        default: '2'
      scope:
        description: 'Cakupan: "global" (total seluruh repo) atau "per_workflow" (per masing-masing workflow)'
        required: true
        type: choice
        default: 'global'
        options:
          - global
          - per_workflow

permissions:
  actions: write
  contents: read

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bersihkan Riwayat Workflow Runs Lama
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          KEEP_RUNS_COUNT: ${{ github.event.inputs.keep_count || '2' }}
          CLEANUP_SCOPE: ${{ github.event.inputs.scope || 'global' }}
        run: node scripts/clean-github-runs.cjs cleanup-history
