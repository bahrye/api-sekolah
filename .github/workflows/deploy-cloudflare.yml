# Push ke branch main → deploy otomatis ke Cloudflare (Pages).
# Sekali setup di GitHub: Settings → Secrets → Actions
#   CLOUDFLARE_API_TOKEN  — token dengan Workers Scripts + Cloudflare Pages (edit)
#   SYNC_SECRET           — untuk workflow sync-github.yml (sama dengan Worker)
#   DATABASE_URL          — opsional jika diset lewat dashboard Pages/Worker (bukan secret Actions)
#   CLOUDFLARE_ACCOUNT_ID — ID akun Cloudflare (dashboard kanan bawah)

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci



      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=api-sekolah-kita --branch production --commit-dirty=true --commit-hash ${{ github.sha }}
